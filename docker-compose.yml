name: pi-stack

# Five binaries (edge is opt-in):
#   edge      :80 / :443  — TLS termination + rate limit + gzip + access log
#                           OPT-IN: `docker compose --profile edge up -d`
#   proxy     :8092       — reverse proxy + label-driven LB (read-only docker socket)
#                           :8094       — internal metrics endpoint
#   dashboard :8093       — auth-gated management UI (read-write docker socket)
#   monitor   :8095       — scrapes proxy+edge metrics, exposes aggregated stats
#                           (no public port; dashboard reads from it)
#   auth      :8096       — SSO login portal + OAuth authorization server
#                           for proxy.auth=true hosts
#                           (no public port; reached via proxy at auth.<domain>)
#   statusbot             — Discord bot; polls dashboard's /api/health and
#                           alerts on up/degraded/unreachable transitions.
#                           Its own container on purpose: if dashboard hangs
#                           or crashes, code running inside it can't report
#                           that. (Still on the same Pi, so it won't survive
#                           a full host outage — process isolation only.)
#                           OPT-IN: requires DISCORD_BOT_TOKEN. DISCORD_CHANNEL_ID
#                           only seeds the initial alert channel (changeable at
#                           runtime via /set-alert-channel).

networks:
  edge:
    name: edge

services:
  edge:
    build:
      context: .
      dockerfile: cmd/edge/Dockerfile
    image: ghcr.io/polarbaejr/proxy-manager-edge:${EDGE_TAG:-latest}
    container_name: edge
    restart: unless-stopped
    profiles: [edge]                    # opt-in: docker compose --profile edge up -d
    networks: [edge]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./cmd/edge/data:/data           # autocert cert cache (persisted)
    environment:
      EDGE_DOMAINS: ${EDGE_DOMAINS:-}   # e.g. foo.example.com,bar.example.com
      EDGE_PEER_SECRET: ${EDGE_PEER_SECRET:-}
    command: >
      -tls-domains ${EDGE_DOMAINS:-}
      -backend http://proxy:8092
      -rate 100 -burst 200 -max-body 10485760
      -peers ${EDGE_PEERS:-}

  proxy:
    build:
      context: .
      dockerfile: cmd/proxy/Dockerfile
    image: ghcr.io/polarbaejr/proxy-manager-proxy:${PROXY_TAG:-latest}
    container_name: proxy
    restart: unless-stopped
    networks: [edge]
    ports:
      # Loopback-only publish: host nginx proxies to 127.0.0.1:8092, but LAN /
      # internet cannot reach the proxy directly (which would bypass edge's
      # rate limiter and let X-Forwarded-For be spoofed).
      - "127.0.0.1:8092:8092"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro     # READ-ONLY
      - ./cmd/proxy/routes.json:/etc/proxy/routes.json:ro
      - ./cmd/proxy/data:/data                           # metrics snapshots (persisted)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # generate: openssl rand -hex 32 — must match the auth service's secret
      PMGR_AUTH_SECRET: ${PMGR_AUTH_SECRET:-}
      # generate separately: openssl rand -hex 32 — must match the dashboard's.
      # Signs the "who did the proxy authenticate" assertion forwarded to
      # backends. Deliberately NOT the same secret: a backend that can verify
      # attributions must not thereby be able to forge sessions or OAuth tokens.
      PMGR_ACTOR_SECRET: ${PMGR_ACTOR_SECRET:-}
      # Shared cross-peer rate-limit store — see REDIS_ADDR/REDIS_PASSWORD in
      # .env.example. Empty = today's in-memory-only rate limiting, unchanged.
      REDIS_ADDR: ${REDIS_ADDR:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Proxy-level peer mesh discovery handshake (see PMGR_PEERS in
      # .env.example). Empty = /peer/handshake disabled, unchanged behavior.
      PMGR_PEER_SECRET: ${PMGR_PEER_SECRET:-}
    # = form so empty env expansions don't swallow the next flag. Auth gating
    # stays OFF until AUTH_DOMAINS is set (e.g. polardev.org,the-aquarium.com);
    # all other proxy flags keep their built-in defaults.
    command: >
      -auth-domains=${AUTH_DOMAINS:-}
      -auth-trusted-cidrs=${AUTH_TRUSTED_CIDRS:-}
      -redis-addr=${REDIS_ADDR:-}
      -peers=${PMGR_PEERS:-}
      -peer-sync-interval=${PMGR_PEER_SYNC_INTERVAL:-5s}
      -peer-advertise-url=${PMGR_PEER_ADVERTISE_URL:-}

  dashboard:
    build:
      context: .
      dockerfile: cmd/dashboard/Dockerfile
    image: ghcr.io/polarbaejr/proxy-manager-dashboard:${DASHBOARD_TAG:-latest}
    container_name: dashboard
    restart: unless-stopped
    networks: [edge]
    labels:
      # Private-only hostname: no public DNS record. Routed by the internal
      # proxy same as any other labeled service; reachability is gated by
      # nginx binding this host's vhost to the Tailscale IP only, not by
      # anything here. DASHBOARD_HOST lets the Pi and Mac mini peer each
      # advertise their own hostname from this one shared compose file.
      proxy.enable:     "true"
      proxy.host:       "${DASHBOARD_HOST:-dashboard.polardev.org}"
      proxy.port:       "8093"
      proxy.service:    "dashboard"
      proxy.unscalable: "true"
    ports:
      # Loopback-only publish: dashboard is reached through the proxy on the
      # docker network (Host: dashboard.polardev.org). Direct :8093 access
      # would leak the plaintext login page + session cookie to any LAN peer.
      - "127.0.0.1:8093:8093"
      # Cross-host peer-handshake port (see DASHBOARD_PEER_SECRET below).
      # Loopback-only here too — reachability across hosts is via the
      # Tailscale-bound nginx stream proxy applied outside this repo.
      - "127.0.0.1:8098:8098"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock        # read-write (service mgmt)
      - ./cmd/proxy/routes.json:/etc/proxy/routes.json    # rw: dashboard appends onboarded routes here
      - ./cmd/dashboard/data:/data                       # auth.json + audit.log (persisted)
      - /proc:/host-proc:ro                              # host CPU + memory stats
      - /mnt/ssd:/host-root:ro                           # host disk stats (SSD)
      # Maintenance mode: nginx returns 503 for any host with a marker file
      # here (snippets/maintenance.conf tests -f per request — no reload).
      # Mounted rw because the dashboard creates/removes those markers; it
      # never reads their contents. Overridable because the default path only
      # exists on the Pi — a literal path would have Docker CREATE it on a dev
      # machine, and the dashboard would then report maintenance "configured"
      # while writing flags that no nginx ever reads.
      - ${MAINT_HOST_DIR:-/etc/nginx/maint.d}:/etc/maint.d
      # Per-app maintenance pages: the dashboard copies each proxy.maintenance
      # app's own 503 page here as <host>/index.html, and nginx prefers it over
      # the shared default (snippets/maintenance.conf try_files). Deliberately
      # the hosts/ SUBDIRECTORY, not /var/www/maintenance itself — that keeps
      # the default page outside anything the dashboard can write. Same
      # override-and-don't-create reasoning as the flag dir above.
      - ${MAINT_PAGE_HOST_DIR:-/var/www/maintenance/hosts}:/var/www/maint-pages
      # Secret-by-reference env values: an env edit of "ref:NAME" (dashboard
      # UI or MCP replace_service/stage_canary) resolves NAME from
      # <this dir>/<service>.env instead of taking a literal value — so a
      # real secret never has to be typed into a tool call or land in an
      # assistant transcript. ONE FILE PER SERVICE (not a single shared
      # file): with multiple services on the host, a flat namespace means
      # two of them picking the same key name silently share a value. Mounted
      # read-only; create each service's file directly on the Pi (KEY=VALUE
      # per line, like a .env file), never through chat/MCP. Same override-
      # and-don't-create reasoning as the maintenance mounts above — if the
      # source path is absent, newSecretsFromEnv degrades to "disabled"
      # rather than pretending refs resolve.
      - ${SECRETS_HOST_DIR:-/etc/proxy-manager/secrets}:/etc/secrets:ro
      # Auto-provisioned credential handoff: on first boot the dashboard
      # mints a "statusbot" API token here if one doesn't already exist, so
      # statusbot never needs a human to manually mint+paste one. Dedicated
      # and narrow on purpose — NOT the /data mount above, which also holds
      # auth.json/audit.log/etc that statusbot has no business seeing.
      - ./cmd/dashboard/tokens:/tokens
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID:   ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_DOMAIN:    ${CLOUDFLARE_DOMAIN:-}
      CLOUDFLARE_ZONES:     ${CLOUDFLARE_ZONES:-}   # extra zones: domain:zoneid[:token], comma-separated
      MONITOR_URL:          http://monitor:8095     # for the Stats tab
      PROXY_URL:            http://proxy:8094       # for the Access tab (proxy /access)
      MAINT_DIR:            /etc/maint.d            # nginx maintenance flag files
      MAINT_PAGE_DIR:       /var/www/maint-pages    # per-host custom 503 pages
      SECRETS_DIR:          /etc/secrets            # ref:NAME env values, one file per service (see mount above)
      # Shared cross-peer state — auth's redis-backed user sync and the
      # peer-registry's version ratchet/mesh-floor tracking. -redis-addr is
      # passed as a command-line flag (see command: below); the password
      # isn't, so it has to come in as a real env var or redis.NewClient
      # connects unauthenticated and every call fails with NOAUTH.
      REDIS_PASSWORD:       ${REDIS_PASSWORD:-}
      # Verifies the proxy's attribution assertion so an action taken through
      # another backend (the MCP server) is audited against the person who
      # asked, not the shared API token. AUDIT ONLY — never authorization.
      PMGR_ACTOR_SECRET:    ${PMGR_ACTOR_SECRET:-}
      # MCP tools served on :8097, proxied at mcp.<domain>/mcp/dashboard via a
      # static route. Empty => read-only tools; true => also maintenance,
      # scale, start/stop, autoupdate and canary.
      MCP_ALLOW_WRITES:     ${MCP_ALLOW_WRITES:-}
      # WebAuthn RP identity — see cmd/dashboard/passkey.go's doc comment.
      # Set PASSKEY_RP_ID to the shared parent domain (e.g. "polardev.org")
      # and list every instance's full origin in PASSKEY_RP_ORIGINS so a
      # passkey registered on one dashboard validates on the other. Empty =>
      # today's default (rp_id=localhost), unchanged.
      PASSKEY_RP_ID:        ${PASSKEY_RP_ID:-}
      PASSKEY_RP_ORIGINS:   ${PASSKEY_RP_ORIGINS:-}
      # This instance's own hostname — labels: above only interpolates it into
      # proxy.host at compose-parse time, it isn't otherwise passed into the
      # container. Also used as the peer-handshake identity below so Pi and
      # Mac mini are distinguishable (container_name is "dashboard" on both).
      DASHBOARD_HOST:       ${DASHBOARD_HOST:-}
      # Dashboard-level peer mesh discovery handshake (see DASHBOARD_PEERS in
      # .env.example). Empty = /peer/handshake disabled, unchanged behavior.
      # Separate trust boundary from PMGR_PEER_SECRET/PMGR_ACTOR_SECRET above.
      DASHBOARD_PEER_SECRET: ${DASHBOARD_PEER_SECRET:-}
    # = form so empty env expansions don't swallow the next flag.
    command: >
      -redis-addr=${REDIS_ADDR:-}
      -peers=${DASHBOARD_PEERS:-}
      -peer-sync-interval=${DASHBOARD_PEER_SYNC_INTERVAL:-5s}
      -peer-addr=:8098
      -peer-writes=${DASHBOARD_PEER_WRITES:-false}

  monitor:
    build:
      context: .
      dockerfile: cmd/monitor/Dockerfile
    image: ghcr.io/polarbaejr/proxy-manager-monitor:${MONITOR_TAG:-latest}
    container_name: monitor
    restart: unless-stopped
    networks: [edge]
    # No host port — dashboard reaches it via the edge network.
    volumes:
      - ./cmd/monitor/data:/data          # store snapshots (persisted)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # for TLS-probing nginx on the host
    command: >
      -targets proxy=http://proxy:8094/metrics,edge=http://edge:8094/metrics,dashboard=http://dashboard:8094/metrics
      -interval 5s
      -window 1h
      -tls-probe-targets ${TLS_PROBE_TARGETS:-}
      -tls-probe-interval 15m

  auth:
    build:
      context: .
      dockerfile: cmd/auth/Dockerfile
    image: ghcr.io/polarbaejr/proxy-manager-auth:${AUTH_TAG:-latest}
    container_name: auth
    restart: unless-stopped
    networks: [edge]
    # No host port — reached through the proxy (Host: auth.<domain>).
    # Sessions live in the signed cookie (no state). The only persisted state is
    # the OPT-IN passkey credential store, written to /data/passkeys.json when
    # AUTH_PASSKEY_DOMAINS is set; with it empty the volume is never touched.
    volumes:
      - ./cmd/auth/data:/data           # opt-in passkey credential store
    environment:
      # generate: openssl rand -hex 32 — must match the proxy's secret
      PMGR_AUTH_SECRET: ${PMGR_AUTH_SECRET:-}
      # Optional per-domain WebAuthn origins override (e.g.
      # https://auth.polardev.org,https://auth.the-aquarium.com). Empty ⇒
      # defaults to https://auth.<domain> for each passkey domain.
      PASSKEY_RP_ORIGINS: ${PASSKEY_RP_ORIGINS:-}
    # = form so empty env expansions don't swallow the next flag. Passkeys stay
    # OFF until AUTH_PASSKEY_DOMAINS is set (e.g. polardev.org,the-aquarium.com).
    command: >
      -cookie-domains=${AUTH_COOKIE_DOMAINS:-polardev.org,the-aquarium.com}
      -dashboard-url=http://dashboard:8093
      -routes-url=http://proxy:8094/routes
      -passkey-rp-domains=${AUTH_PASSKEY_DOMAINS:-}

  statusbot:
    build:
      context: .
      dockerfile: cmd/statusbot/Dockerfile
    image: ghcr.io/polarbaejr/proxy-manager-statusbot:${STATUSBOT_TAG:-latest}
    container_name: statusbot
    restart: unless-stopped
    profiles: [statusbot]               # opt-in: docker compose --profile statusbot up -d
    networks: [edge]
    # No host port — not web-accessible, doesn't need proxy.* labels. Reaches
    # dashboard over the edge network; reaches Discord's gateway outbound.
    volumes:
      - ./cmd/statusbot/data:/data      # persisted alert-channel.json (see /set-alert-channel)
      - ./cmd/dashboard/tokens:/tokens:ro   # auto-provisioned dashboard API token (see dashboard's /tokens mount)
    environment:
      # From the Discord Developer Portal: create an application + bot, enable
      # the "Message Content" privileged intent (required for !status to see
      # command text), invite it to the server, then the channel ID to alert
      # into. Set these directly on the Pi (.env or compose override) — never
      # paste the token into chat/MCP, it's a real credential.
      DISCORD_BOT_TOKEN:    ${DISCORD_BOT_TOKEN:-}
      # Optional now — only seeds the alert channel on first run (or when
      # /data isn't persisting). Once set, /set-alert-channel (Manage Server
      # permission required) overrides it at runtime and that choice survives
      # restarts; this env var is then ignored.
      DISCORD_CHANNEL_ID:   ${DISCORD_CHANNEL_ID:-}
      # Optional. If set, /set-alert-channel registers guild-scoped and is
      # available almost instantly. If empty, it registers globally, which
      # can take Discord up to ~1 hour to propagate to clients.
      DISCORD_GUILD_ID:     ${DISCORD_GUILD_ID:-}
      # Optional override. Left unset, statusbot reads an auto-provisioned
      # token the dashboard mints on first boot into the shared /tokens
      # mount above — no manual minting step needed. Set this only to point
      # at a token from elsewhere (e.g. a different dashboard instance).
      DASHBOARD_API_TOKEN:  ${DASHBOARD_API_TOKEN:-}
    command: >
      -health-url=http://dashboard:8093/api/health
      -poll-interval=60s
      -status-url=http://dashboard:8093/api/service-status
      -status-interval=15s
      -token-file=/tokens/statusbot.token
