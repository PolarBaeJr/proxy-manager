# Dashboard peer transport (Pi side), 2026-08-24. Mirrors the Mac mini's
# deploy/nginx-stream/nginx.conf pattern exactly: a second, minimal nginx
# instance, stream{} only, running alongside the main HTTP-fronting nginx.
#
# Why not a stream{} block in /etc/nginx/nginx.conf, where it would naturally
# live: `listen <tailscale-ip>:port` is FATAL to nginx at boot if that
# Tailscale interface doesn't exist yet (nginx -t fails, process never
# starts). Tailscale (tailscaled.service) is an independent systemd unit with
# no ordering guarantee ahead of nginx.service — folding this in risks taking
# down :80/:443 for every site on this box over a dashboard-peer side
# channel on an unlucky boot. Instead this runs under its own systemd unit
# (nginx-stream.service) with Restart=on-failure, so a boot-time bind
# failure just retries until Tailscale is up, and the HTTP edge never
# notices.
#
# The stream module is a DYNAMIC module on this Debian build
# (--with-stream=dynamic) — unlike the Mac's static Homebrew build, it must
# be loaded explicitly here.
load_module /usr/lib/nginx/modules/ngx_stream_module.so;

worker_processes 1;
pid /run/nginx-stream.pid;
error_log /var/log/nginx-stream/error.log;

events {
    worker_connections 256;
}

stream {
    # Tailnet address only. Never 0.0.0.0 — that would expose the dashboard
    # port to the LAN. The Mac mini peer reaches this over Tailscale; the
    # LAN and public internet cannot.
    server {
        listen 100.123.79.47:8093;

        # The dashboard container publishes to the Pi's own loopback only
        # (127.0.0.1:8093:8093, see docker-compose.yml) — same reasoning as
        # the Mac's Redis block: this proxy is what actually terminates the
        # Tailscale-facing connection and forwards it in.
        proxy_pass 127.0.0.1:8093;

        proxy_timeout 300s;
        proxy_connect_timeout 5s;
    }
}
