# LIVE COPY, host-specific — this is the Mac mini's actual running config,
# not a portable template. nginx has no env-var interpolation, so the
# Tailscale IP (100.83.62.68) and path (/Users/matthew) below are literal
# to this one machine. Copying this onto a second peer node without editing
# both would silently bind the wrong tailnet address.
#
# Redis-over-Tailscale TCP proxy. DELIBERATELY a separate nginx instance from
# the box's HTTP edge at /Users/matthew/deploy/nginx.
#
# Why not a stream{} block in the main nginx.conf, which is where it would
# naturally live:
#
#   `listen 100.83.62.68:6379` binds a TAILSCALE address. nginx treats a
#   bind() failure as [emerg] and REFUSES TO START — verified, not assumed:
#     nginx: [emerg] bind() to <absent-ip>:6379 failed (49: Can't assign
#     requested address) ... configuration file test failed
#
#   nginx is a boot-time LaunchDaemon; Tailscale comes up asynchronously and
#   is not guaranteed to have assigned the address yet. In the main config,
#   one unlucky boot ordering would take down :80 and :443 for EVERY site on
#   this Mac because of a Redis side-channel. Splitting it means the worst
#   case is "Redis proxy retries until Tailscale is up" and the HTTP edge
#   never notices.
#
# No port conflict with the main instance: different address, different port,
# own pid file. The "one nginx per box" rule is about :443 contention, which
# this does not touch.

worker_processes 1;
pid /Users/matthew/deploy/nginx-stream/nginx.pid;
error_log /Users/matthew/deploy/nginx-stream/logs/error.log;

events {
    worker_connections 256;
}

stream {
    # Tailnet address only. Never 0.0.0.0 — that would expose Redis to the LAN.
    # Peer proxies reach this over Tailscale; the LAN and public internet cannot.
    server {
        listen 100.83.62.68:6379;

        # Redis publishes to the macOS loopback (127.0.0.1:6379:6379). It cannot
        # publish to the Tailscale IP directly: Tailscale exists only in the
        # macOS network namespace and the Colima VM never sees that interface.
        # The connection therefore reaches Redis as 127.0.0.1, so --requirepass
        # is doing ALL of the authentication. Do not remove it.
        proxy_pass 127.0.0.1:6379;

        proxy_timeout 300s;
        proxy_connect_timeout 5s;
    }
}
