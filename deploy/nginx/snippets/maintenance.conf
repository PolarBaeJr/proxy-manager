# Per-site maintenance switch. Include at SERVER level in a proxied vhost.
#
# This file is the source of truth for what lives at
# /etc/nginx/snippets/maintenance.conf on the host. It is NOT deployed by
# docker compose — nginx runs on the host, outside the stack. Installing it is
# a manual step; see deploy/nginx/README.md.
#
# Toggle:  sudo maint on  <host>      -> that host shows the page
#          sudo maint off <host>      -> back to normal
# No reload needed: the -f tests are evaluated per request.
#
# Four flag names are checked. $maint_parent and $maint_zone come from
# conf.d/maintenance-scope.conf.
#
#   maint.d/a.b.polardev.org     just that host
#   maint.d/_all.b.polardev.org  every *.b.polardev.org
#   maint.d/_all.polardev.org    every *.polardev.org
#   maint.d/_all                 every vhost on this Pi
#
# Cost is 4 stat() per request instead of 1; they are all dentry-cached.
#
# proxy_intercept_errors is off by default, so this error_page catches ONLY
# nginx's own 'return 503' below -- a genuine 503 from proxy-manager still
# passes through with its own styled page.
set $maint "";
if (-f /etc/nginx/maint.d/$host)              { set $maint "on"; }
if (-f /etc/nginx/maint.d/_all.$maint_parent) { set $maint "on"; }
if (-f /etc/nginx/maint.d/_all.$maint_zone)   { set $maint "on"; }
if (-f /etc/nginx/maint.d/_all)               { set $maint "on"; }
if ($maint_bypass)                            { set $maint "";   }
if ($maint = "on")                            { return 503;      }

error_page 503 @maintenance;
location @maintenance {
    root /var/www/maintenance;
    add_header Retry-After 300 always;
    add_header Cache-Control "no-store" always;
    # Per-host override: an app can ship its own maintenance page, which the
    # dashboard caches to hosts/<host>/index.html. Missing -> default page.
    # File candidates are served from this location; only the =503 fallback
    # would re-enter location matching, and it is unreachable in practice.
    try_files /hosts/$host/index.html /index.html =503;
}
