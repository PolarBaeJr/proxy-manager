# SUPERSEDED as a standalone file: the Mac mini's live nginx-stream instance
# (see deploy/nginx-stream/nginx.conf) now carries this block plus two more
# (dashboard main port, dashboard peer-handshake port) in one stream{}, not
# this file in isolation. Kept here as the original single-purpose reference
# copy — content below still matches the live Redis server{} block.
#
# Exposes the peer mesh's shared Redis (rate-limit store) on this host's
# Tailscale IP, and nowhere else. Confirmed by direct probe on the Mac mini
# (2026-08-24): 127.0.0.1 reachable, LAN IP refused.
#
# Why this exists instead of a Docker port publish: on a Colima/macOS node,
# `docker compose`'s port-publishing runs inside the VM's own network
# namespace, which never sees the host's Tailscale interface — a container
# cannot bind a Tailscale IP directly ("cannot assign requested address").
# redis therefore only publishes to 127.0.0.1 (see docker-compose.mac.yml);
# native nginx, which runs on the correct side of that VM boundary, is what
# actually terminates the Tailscale-facing connection and forwards it in.
#
# DO NOT include this from the main nginx.conf's http-fronting instance.
# `listen <tailscale-ip>:port` is FATAL (not a warning) if that address
# doesn't exist yet when nginx starts — confirmed by direct test: `nginx -t`
# fails outright and the process never starts. Tailscale is a separate boot
# service with no ordering guarantee ahead of nginx, so folding this into
# the main nginx.conf would mean one unlucky boot (Tailscale not up yet)
# takes down :80/:443 for every site on this box because of a Redis
# side-channel. Instead this runs under a second, minimal nginx instance
# dedicated to stream{} (events{} + this include, nothing else) managed by
# its own LaunchDaemon with KeepAlive — so a failed bind at boot just
# retries until Tailscale comes up, and the HTTP edge never notices. See
# deploy/nginx/README.md for the install path and LaunchDaemon plist.
#
# stream{} is a TOP-LEVEL block, a sibling of http{} — it cannot be
# included from anything under conf.d/ (which only reaches http{}). Also
# requires an nginx build with --with-stream (confirmed present in this
# box's Homebrew nginx).
#
# Auth is handled entirely by redis's own --requirepass, not by this proxy —
# a bare TCP stream_proxy_pass has no visibility into the Redis protocol to
# enforce anything itself.
server {
    listen 100.83.62.68:6379;
    proxy_pass 127.0.0.1:6379;
}
