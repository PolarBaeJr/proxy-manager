# Resolves the true visitor IP behind Cloudflare for every nginx-fronted
# host on this box. Without this, $remote_addr (and therefore
# X-Forwarded-For/X-Real-IP passed to backends, and proxy-manager's
# proxy.ratelimit bucketing) is the Cloudflare edge IP, not the visitor —
# every visitor collapses into one shared bucket. See proxy-manager memory
# project_ratelimit_xff_cloudflare_bug.md.
#
# Safe by construction: real_ip only rewrites $remote_addr when the RAW TCP
# peer is one of these Cloudflare ranges, so a direct-to-origin connection
# (the intentional Tailscale/LAN maintenance-bypass path — see
# /etc/nginx/conf.d/maintenance-bypass.conf) can't spoof its own IP via a
# forged header. $realip_remote_addr always preserves the true original TCP
# peer regardless of whether a rewrite happened, which is what
# maintenance-bypass.conf's geo block keys on instead of $remote_addr.
#
# Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6, fetched 2026-08-19.
# Re-fetch and diff periodically — Cloudflare updates this list occasionally.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# X-Forwarded-For, not CF-Connecting-IP: live traffic on this box (2026-08-19)
# showed some request types (server-to-server RPC calls) arrive through
# Cloudflare without a CF-Connecting-IP header at all, leaving $remote_addr
# unrewritten (correctly — real_ip has nothing to rewrite with). XFF is the
# more universally-set header, and it's also what proxy-manager's own Go
# code (cmd/proxy/auth.go realClientIP) already reads downstream, so this
# keeps both layers consistent.
real_ip_header X-Forwarded-For;
real_ip_recursive on;
#
# A raw Cloudflare-range IP (e.g. 162.158.0.0/15) showing up as $remote_addr
# in access logs is NOT necessarily a regression: it means that specific
# request's trusted peer sent no usable X-Forwarded-For, so real_ip
# correctly declined to rewrite (fail-safe, not fail-open). Confirmed
# 2026-08-19 by independent audit from the sfu-badmonton-app-98 session.
