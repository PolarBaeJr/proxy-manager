# Who is allowed through while a site is in maintenance.
#
# Deliberately keyed on $realip_remote_addr (the true TCP peer, preserved by
# ngx_http_realip_module regardless of whether a rewrite happened — see
# /etc/nginx/conf.d/cloudflare-realip.conf), NOT on $remote_addr and NOT on
# any X-Forwarded-For / CF-Connecting-IP header directly: headers are
# client-supplied on a direct connection and would be trivially spoofable
# into a bypass.
#
# Corrected 2026-08-19: this used to key on plain $remote_addr, which was
# safe before cloudflare-realip.conf existed (nothing rewrote it) but would
# have broken the moment real_ip was added — real_ip rewrites $remote_addr
# to the visitor's own IP for genuine Cloudflare traffic, and Tailscale's
# CGNAT range (100.64.0.0/10) genuinely overlaps with ranges some mobile
# carriers also use for CGNAT. A visitor on the wrong carrier hitting the
# site through Cloudflare would have been miskeyed into this bypass rule.
# $realip_remote_addr sidesteps this: it always holds the original,
# un-rewritten TCP peer, verified empirically (not just by nginx docs, which
# don't specify this) to be populated even for a peer that matches no
# set_real_ip_from entry — i.e. the normal Tailscale/LAN/loopback case.
#
# Anything arriving via Cloudflare has a Cloudflare edge IP as its true peer
# and so falls through to 'default 0' = gets the maintenance page. Only a
# connection made straight to the Pi over Tailscale or the LAN bypasses.
geo $realip_remote_addr $maint_bypass {
    default        0;
    127.0.0.0/8    1;   # loopback (local curl / health checks)
    100.64.0.0/10  1;   # Tailscale CGNAT range
    192.168.1.0/24 1;   # home LAN
}
